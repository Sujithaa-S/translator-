<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voice Translator</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 500px;
        background: white;
        padding: 30px;
        border-radius: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        text-align: center;
    }

    h1 {
        color: #333;
        margin-bottom: 10px;
    }

    .subtitle {
        color: #777;
        margin-bottom: 25px;
    }

    .language-buttons {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }

    button {
        border: none;
        border-radius: 12px;
        padding: 14px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        transform: scale(1.03);
    }

    .english {
        background: #ffc800;
        color: #222;
        flex: 1;
    }

    .tamil {
        background: #00c853;
        color: white;
        flex: 1;
    }

    .mic {
        width: 100%;
        background: #5e35b1;
        color: white;
        font-size: 18px;
        margin-bottom: 20px;
    }

    .mic:disabled {
        background: #aaa;
        cursor: not-allowed;
    }

    .box {
        background: #f5f5f5;
        border-radius: 15px;
        padding: 15px;
        margin-top: 15px;
        text-align: left;
        min-height: 80px;
    }

    .box-title {
        font-weight: bold;
        color: #555;
        margin-bottom: 8px;
    }

    #inputText, #outputText {
        font-size: 18px;
        color: #222;
        word-wrap: break-word;
    }

    .speak {
        width: 100%;
        background: #2196f3;
        color: white;
        margin-top: 15px;
    }

    .clear {
        width: 100%;
        background: #eeeeee;
        color: #333;
        margin-top: 10px;
    }

    #status {
        margin-top: 15px;
        color: #666;
        font-size: 14px;
    }
</style>
</head>

<body>

<div class="container">

    <h1>🌐 Voice Translator</h1>

    <p class="subtitle">
        English ↔ Tamil Voice Translator
    </p>

    <div class="language-buttons">
        <button class="english" onclick="setLanguage('en')">
            🇬🇧 English → Tamil
        </button>

        <button class="tamil" onclick="setLanguage('ta')">
            🇮🇳 Tamil → English
        </button>
    </div>

    <button class="mic" id="micButton" onclick="startListening()">
        🎤 Speak
    </button>

    <div class="box">
        <div class="box-title">Your Speech</div>
        <div id="inputText">Tap Speak and say something...</div>
    </div>

    <div class="box">
        <div class="box-title">Translation</div>
        <div id="outputText">Translation will appear here...</div>
    </div>

    <button class="speak" onclick="speakTranslation()">
        🔊 Listen
    </button>

    <button class="clear" onclick="clearAll()">
        🗑️ Clear
    </button>

    <div id="status"></div>

</div>

<script>

let selectedLanguage = "en";
let translatedLanguage = "ta";
let translatedText = "";

function setLanguage(language) {

    selectedLanguage = language;

    if (language === "en") {
        translatedLanguage = "ta";
        document.getElementById("status").innerText =
            "English → Tamil selected";
    } 
    else {
        translatedLanguage = "en";
        document.getElementById("status").innerText =
            "Tamil → English selected";
    }
}

function startListening() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Speech recognition is not supported in this browser.");
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang =
        selectedLanguage === "en"
        ? "en-IN"
        : "ta-IN";

    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    const micButton =
        document.getElementById("micButton");

    micButton.disabled = true;
    micButton.innerText = "🎙️ Listening...";

    document.getElementById("status").innerText =
        "Listening... Please speak.";

    recognition.start();

    recognition.onresult = function(event) {

        const text =
            event.results[0][0].transcript;

        document.getElementById("inputText").innerText = text;

        translateText(text);
    };

    recognition.onerror = function(event) {

        document.getElementById("status").innerText =
            "Error: " + event.error;

        micButton.disabled = false;
        micButton.innerText = "🎤 Speak";
    };

    recognition.onend = function() {

        micButton.disabled = false;
        micButton.innerText = "🎤 Speak";
    };
}


async function translateText(text) {

    document.getElementById("status").innerText =
        "Translating...";

    const from = selectedLanguage;
    const to = translatedLanguage;

    const url =
        "https://api.mymemory.translated.net/get?q=" +
        encodeURIComponent(text) +
        "&langpair=" +
        from + "|" + to;

    try {

        const response = await fetch(url);

        const data = await response.json();

        translatedText =
            data.responseData.translatedText;

        document.getElementById("outputText").innerText =
            translatedText;

        document.getElementById("status").innerText =
            "Translation completed ✓";

    } catch (error) {

        document.getElementById("outputText").innerText =
            "Translation failed.";

        document.getElementById("status").innerText =
            "Please check your internet connection.";
    }
}


function speakTranslation() {

    if (translatedText === "") {
        alert("No translation available.");
        return;
    }

    const speech =
        new SpeechSynthesisUtterance(translatedText);

    speech.lang =
        translatedLanguage === "ta"
        ? "ta-IN"
        : "en-IN";

    speech.rate = 0.9;

    window.speechSynthesis.speak(speech);
}


function clearAll() {

    document.getElementById("inputText").innerText =
        "Tap Speak and say something...";

    document.getElementById("outputText").innerText =
        "Translation will appear here...";

    document.getElementById("status").innerText = "";

    translatedText = "";

    window.speechSynthesis.cancel();
}

</script>

</body>
</html>
